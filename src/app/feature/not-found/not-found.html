<div class="min-h-screen flex items-center justify-center bg-gray-50 p-6">
  <p-card ngClass="max-w-md text-center py-6 border border-gray-300">
    <!-- Icon -->
    <div class="flex justify-center mb-4">
      <p-avatar
        icon="pi pi-exclamation-triangle"
        ngClass="bg-yellow-100 text-yellow-600"
        size="xlarge"
        shape="circle"
        style="width: 85px; height: 85px; font-size: 34px"
      ></p-avatar>
    </div>

    <!-- Title -->
    <h1 class="text-3xl font-bold text-gray-700 mt-2">Trang không tồn tại</h1>

    <!-- Description -->
    <p class="text-gray-600 mt-3 leading-relaxed">
      Trang bạn đang tìm có thể đã bị xóa,<br />
      hoặc đường dẫn không hợp lệ.
    </p>

    <p class="text-xs text-gray-400 mt-2 italic">
      Vui lòng kiểm tra lại đường dẫn hoặc quay về trang chủ.
    </p>

    <!-- Button -->
    <div class="flex justify-center mt-8">
      <p-button
        label="Quay lại Trang chủ"
        icon="pi pi-home"
        styleClass="p-button-primary px-5"
        (click)="redirect('/dashboard')"
      ></p-button>
    </div>
  </p-card>
</div>
