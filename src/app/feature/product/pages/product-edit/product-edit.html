@if (loading()) {
  <app-loading />
}

@if (!loading() && product()) {
  <form [formGroup]="form" class="max-w-4xl p-6 grid grid-cols-2 gap-6">
    <div class="flex flex-col items-center gap-3">
      <input type="text" class="input" placeholder="URL hình ảnh" formControlName="UrlImage" />
    </div>
    <div class="space-y-4">
      <div>
        <label>Tên sản phẩm</label>
        <input class="input" formControlName="Name" />
      </div>

      <div>
        <label>Mã sản phẩm</label>
        <input class="input" formControlName="Code" />
      </div>

      <div>
        <label>Đơn vị</label>
        <input class="input" formControlName="UnitName" />
      </div>

      <div>
        <label>Thời gian sử dụng</label>
        <input type="number" class="input" formControlName="TimeUsed" />
      </div>

      <div>
        <label>Giá bán</label>
        <input type="number" class="input" formControlName="Price" />
      </div>

      <div>
        <label>VAT (%)</label>
        <input type="number" class="input" formControlName="VatRate" />
      </div>

      <div class="flex gap-3 pt-4">
        <button type="button" class="px-4 py-2 bg-blue-600 text-white rounded" (click)="onSubmit()">
          Lưu
        </button>

        <button type="button" class="px-4 py-2 bg-gray-300 rounded" (click)="dialogRef.close()">
          Hủy
        </button>
      </div>
    </div>
  </form>
}

@if (!product() && !loading()) {
  <app-no-data />
}
