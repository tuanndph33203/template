<div
  class="bg-white/80 dark:bg-[rgb(39,39,42)] space-y-4 rounded-md px-4 pt-1 text-slate-800 dark:text-slate-200 border border-transparent dark:border-slate-700"
>
  <form
    [formGroup]="formSearch"
    class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-5 gap-4 py-2"
  >
    <!-- TextFilter -->
    <p-floatlabel variant="on">
      <input
        pInputText
        id="TextFilter"
        type="text"
        class="w-full h-[35px] dark:bg-slate-800 dark:text-slate-200 dark:border-slate-600"
        formControlName="TextFilter"
      />
      <label for="TextFilter" class="!font-normal text-sm">Nhập tên sản phẩm</label>
    </p-floatlabel>

    <!-- MerchantCode -->
    <p-floatlabel variant="on">
      <p-select
        [options]="branchOptions()"
        optionLabel="Notes"
        optionValue="Code"
        class="w-full h-[35px] dark:bg-slate-800 dark:text-slate-200 dark:border-slate-600"
        formControlName="MerchantCode"
        filter="true"
      />
      <label for="MerchantCode" class="!font-normal text-sm">Chọn chi nhánh</label>
    </p-floatlabel>
  </form>

  <div class="h-full text-sm">
    <app-table-meta
      [dataTable]="products()"
      [columns]="colsTemp() ?? []"
      [scrollHeight]="41 * 15 + 54"
      [currentPage]="searchQuery().page"
      [pageSize]="searchQuery().size"
      [showNodata]="true"
      [showColumnToggle]="true"
      [showTotalRecord]="true"
      [showLoading]="loading()"
      [showRefresh]="true"
      [totalData]="total()"
      (actionRefresh)="search(searchQuery())"
      (actionClick)="handleAction($event)"
    />

    <div class="flex items-center justify-center">
      <p-paginator
        class="dark:bg-[rgb(39,39,42)] dark:text-slate-200"
        (onPageChange)="onPageChange($event)"
        [first]="(searchQuery().page - 1) * searchQuery().size"
        [rows]="searchQuery().size"
        [totalRecords]="total()"
      />
    </div>
  </div>
</div>
